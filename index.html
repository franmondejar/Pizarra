<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no"
    >

    <title>Pizarra XR — Laboratorio V0.0</title>

    <link rel="stylesheet" href="./css/styles.css">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

    <!-- Nuestro motor de escritura -->
    <script src="./js/marker.js"></script>
</head>

<body>

<a-scene
    xr-mode-ui="enabled: true"
    renderer="antialias: true; colorManagement: true"
    background="color: #111827"
>

    <!-- =====================================================
         PIZARRA
         ===================================================== -->

    <a-entity
        id="board"
        position="0 1.6 -1.6"
    >

        <!-- Superficie blanca -->
        <a-plane
            id="boardSurface"
            width="2.4"
            height="1.35"
            material="
                shader: flat;
                color: #FFFFFF;
                side: double
            "
            xr-whiteboard
        ></a-plane>


        <!-- Marco -->

        <a-box
            position="0 0.70 0"
            width="2.5"
            height="0.05"
            depth="0.05"
            color="#555555"
        ></a-box>

        <a-box
            position="0 -0.70 0"
            width="2.5"
            height="0.05"
            depth="0.05"
            color="#555555"
        ></a-box>

        <a-box
            position="-1.225 0 0"
            width="0.05"
            height="1.4"
            depth="0.05"
            color="#555555"
        ></a-box>

        <a-box
            position="1.225 0 0"
            width="0.05"
            height="1.4"
            depth="0.05"
            color="#555555"
        ></a-box>

    </a-entity>


    <!-- =====================================================
         CONTROLADOR DERECHO
         ===================================================== -->

    <a-entity
        id="rightHand"
        hand-controls="hand: right"
        xr-marker
    >

        <!-- Punta del rotulador -->

        <a-sphere
            id="markerTip"
            position="0 0 -0.08"
            radius="0.012"
            color="#777777"
        ></a-sphere>

    </a-entity>


    <!-- =====================================================
         CONTROLADOR IZQUIERDO
         ===================================================== -->

    <a-entity
        id="leftHand"
        hand-controls="hand: left"
    ></a-entity>


    <!-- =====================================================
         ILUMINACIÓN
         ===================================================== -->

    <a-light
        type="ambient"
        intensity="0.8"
    ></a-light>

    <a-light
        type="directional"
        intensity="0.6"
        position="1 3 2"
    ></a-light>


</a-scene>

</body>
</html>
