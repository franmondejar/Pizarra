<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no"
    >

    <title>Pizarra — Laboratorio V0.0.1</title>

    <link rel="stylesheet" href="./css/styles.css">

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="./js/marker.js"></script>
</head>

<body>

<button id="enterXR">
    ENTRAR EN XR
</button>


<a-scene
    webxr="
        referenceSpaceType: local-floor;
        optionalFeatures: local-floor, bounded-floor;
    "

    xr-mode-ui="
        enabled: true;
        XRMode: xr;
    "

    renderer="
        antialias: true;
        colorManagement: true;
    "

    background="color: #111827"
>


    <!-- ==========================================
         PIZARRA
         ========================================== -->

    <a-entity
        id="board"
        position="0 1.6 -1.6"
    >

        <a-plane
            id="boardSurface"
            width="2.4"
            height="1.35"
            material="
                shader: flat;
                color: #FFFFFF;
                side: double
            "
        ></a-plane>


        <!-- Marco -->

        <a-box
            position="0 0.70 0"
            width="2.5"
            height="0.05"
            depth="0.05"
            color="#444444"
        ></a-box>

        <a-box
            position="0 -0.70 0"
            width="2.5"
            height="0.05"
            depth="0.05"
            color="#444444"
        ></a-box>

        <a-box
            position="-1.225 0 0"
            width="0.05"
            height="1.4"
            depth="0.05"
            color="#444444"
        ></a-box>

        <a-box
            position="1.225 0 0"
            width="0.05"
            height="1.4"
            depth="0.05"
            color="#444444"
        ></a-box>

    </a-entity>


    <!-- ==========================================
         CONTROLADOR / ROTULADOR DERECHO
         ========================================== -->

    <a-entity
        id="rightHand"
        tracked-controls="
            hand: right;
            controller: 0;
        "
        xr-marker
    >

        <!-- Cuerpo del rotulador -->

        <a-cylinder
            id="markerBody"
            position="0 0 -0.10"
            rotation="90 0 0"
            radius="0.012"
            height="0.16"
            color="#E5E7EB"
        ></a-cylinder>


        <!-- Punta -->

        <a-sphere
            id="markerTip"
            position="0 0 -0.19"
            radius="0.014"
            color="#808080"
        ></a-sphere>

    </a-entity>


    <!-- Controlador izquierdo:
         solo tracking, sin mano ni rayo -->

    <a-entity
        id="leftHand"
        tracked-controls="
            hand: left;
            controller: 0;
        "
    ></a-entity>


    <!-- ==========================================
         ILUMINACIÓN
         ========================================== -->

    <a-light
        type="ambient"
        intensity="0.9"
    ></a-light>

    <a-light
        type="directional"
        intensity="0.5"
        position="1 3 2"
    ></a-light>


</a-scene>


<script>

document
    .querySelector("#enterXR")
    .addEventListener("click", async () => {

        const scene =
            document.querySelector("a-scene");

        if (!navigator.xr) {

            alert(
                "WebXR no está disponible en este navegador."
            );

            return;
        }


        try {

            const supported =
                await navigator.xr.isSessionSupported(
                    "immersive-vr"
                );


            if (!supported) {

                alert(
                    "Este dispositivo no permite immersive-vr."
                );

                return;
            }


            scene.enterVR();


        } catch (error) {

            console.error(error);

            alert(
                "No se ha podido iniciar WebXR."
            );
        }

    });

</script>

</body>
</html>
